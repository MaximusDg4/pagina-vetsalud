<!DOCTYPE html>
<html lang="es">
<head>

    <header>

        <h1>Solicitud de Turnos - Vet Salud</h1>
        <a href="index.html" class="btn-inicio">← Volver al Inicio</a>
    </header>
    </header>

    <main>
        <form id="formulario-turnos">
            <div>
                <label for="nombre-mascota">Nombre de la mascota:</label>
                <input type="text" id="nombre-mascota" placeholder="Ej: Firulais">
            </div>
            <div>
                
              <label for="tipo-o-raza">Tipo o raza:</label>
                <input type="text" id="tipo-o-raza">
            </div>

            <div>
                <label for="contacto-usuario">Numero de telefono o correo  :</label>
                <input type="text" id="contacto-usuario" placeholder="Ej: abc@gmail.com ">
            </div>

            <button type="submit" id="btn-enviar-solicitud">Enviar Solicitud</button>
        </form>

        <div id="mensaje-alerta"></div>
    </main>
